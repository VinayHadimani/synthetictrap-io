<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="neonPulse" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M50 12 L82 23 C82 56 68 76 50 88 C32 76 18 56 18 23 Z" 
        fill="url(#shieldGrad)" 
        stroke="#27272A" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Honeypot Matrix / Hexagonal Trap -->
  <polygon points="50,32 64,40 64,56 50,64 36,56 36,40" 
           fill="none" 
           stroke="#3F3F46" 
           stroke-width="1.8" 
           stroke-dasharray="3 2" />

  <!-- Honeypot Circuit Core -->
  <polygon points="50,38 59,43 59,53 50,58 41,53 41,43" 
           fill="none" 
           stroke="url(#neonPulse)" 
           stroke-width="2" />

  <!-- Precision Tripwire Matrix Lines -->
  <line x1="50" y1="18" x2="50" y2="32" stroke="#52525B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="64" x2="50" y2="82" stroke="#52525B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="48" x2="36" y2="48" stroke="#52525B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="64" y1="48" x2="76" y2="48" stroke="#52525B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Sensor Node Points -->
  <circle cx="50" cy="18" r="2.5" fill="#10B981" />
  <circle cx="24" cy="48" r="2" fill="#71717A" />
  <circle cx="76" cy="48" r="2" fill="#71717A" />
  <circle cx="50" cy="82" r="2" fill="#71717A" />

  <!-- Active Trap Spark Node -->
  <circle cx="50" cy="48" r="4" fill="#EF4444" filter="url(#coreGlow)" />
  <circle cx="50" cy="48" r="1.8" fill="#FFFFFF" />
</svg>
